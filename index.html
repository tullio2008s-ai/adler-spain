<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADLER Product Cost</title>
<style>
:root{--navy:#0f1b33;--navy2:#1a2b4f;--bg:#f3f5f9;--card:#fff;--ink:#17203a;--mut:#6b7590;--line:#e2e6ef;--acc:#2563eb;--teal:#0d9488;--amb:#f59e0b;--vio:#8b5cf6;--sl:#94a3b8;--ok:#15803d;--bad:#b91c1c;--est:#fff7e0;--tng:#c2410c;--zgz:#1d4ed8}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 "Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:236px;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#cbd5ea;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.logo{padding:4px 10px 16px;border-bottom:1px solid #ffffff22;margin-bottom:10px}
.logo b{display:block;color:#fff;font-size:18px;letter-spacing:.5px}.logo span{font-size:12px;color:#8fa0c4}
aside button.nv{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;color:#cbd5ea}
aside button.nv:hover{background:#ffffff14}aside button.nv.on{background:var(--acc);color:#fff;font-weight:600}
aside .grow{flex:1}aside .mini{font-size:12px;color:#8fa0c4;padding:0 10px}
aside .tools button{width:100%;margin-top:6px;background:#ffffff14;color:#e6ecf8;border:0;border-radius:8px;padding:7px;cursor:pointer;font-size:12.5px}
aside .tools button:hover{background:#ffffff26}
.wrap{flex:1;min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:20px}.top .sp{flex:1}
main{padding:22px 28px 60px;max-width:1500px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 2px #0f1b330a;overflow-x:auto}
h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:600;background:#fafbfd}
td.n,th.n{text-align:right}tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:#f0f5ff}
th.t,td.t{border-left:3px solid var(--tng)}th.z,td.z{border-left:3px solid var(--zgz)}
input[type=number],input[type=text],input[type=password],select{border:1px solid #d3d9e6;border-radius:8px;padding:6px 8px;background:#fff;font:inherit;color:inherit;width:100%;min-width:70px}
input[type=number]{text-align:right}input:focus,select:focus{outline:2px solid #2563eb44;border-color:var(--acc)}
.est input,.est select,input.est{background:var(--est)}
td.out{text-align:right;font-variant-numeric:tabular-nums;background:#f8fafd}
td.out.tot{font-weight:700}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:600}
.btn.sec{background:#e8edf7;color:var(--ink)}.btn.del{background:transparent;color:var(--bad);padding:3px 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.tabs{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 18px;font-weight:600;color:var(--mut)}
.tabs button.on{color:#fff;border-color:transparent}
.tabs button.on.T{background:var(--tng)}.tabs button.on.Z{background:var(--zgz)}.tabs button.on.C{background:var(--navy)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.b-bc{background:#dcfce7;color:#166534}.b-ad{background:#dbeafe;color:#1e40af}.b-es{background:#fef3c7;color:#92400e}.b-de{background:#f1f5f9;color:#475569}
.b-t{background:#ffedd5;color:var(--tng)}.b-z{background:#dbeafe;color:var(--zgz)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{color:var(--mut);font-size:12.5px;display:block}.kpi b{font-size:24px;display:block;margin-top:2px}.kpi small{color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;background:#eef1f7}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:600;overflow:hidden}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 14px;font-size:12.5px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}
.pc:hover{border-color:var(--acc);box-shadow:0 6px 18px #2563eb1a;transform:translateY(-1px)}
.pc h4{margin:0 0 2px;font-size:14px}.pc .pn{color:var(--mut);font-size:12px}
.pc .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 6px}
.pc .two div{border-left:3px solid;padding-left:8px}.pc .two div.t{border-color:var(--tng)}.pc .two div.z{border-color:var(--zgz)}
.pc .two span{display:block;font-size:11.5px;color:var(--mut)}.pc .two b{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 18px}
.f label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.warn{background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;padding:9px 12px;border-radius:10px;margin:10px 0}
.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:9px 12px;border-radius:10px;margin:0 0 16px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
code{background:#eef1f7;padding:1px 5px;border-radius:4px;font-size:12.5px}
.bar{height:7px;border-radius:4px;background:#e5e9f3;min-width:90px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%}
.back{background:none;border:0;color:var(--acc);font-weight:600;padding:0;margin-bottom:10px}
li{margin:4px 0}
@media(max-width:860px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}.logo{display:none}aside .grow,aside .mini,aside .tools{display:none}main,.top{padding:14px}}
.hid{display:none!important}#login{width:380px;max-width:92vw;align-self:flex-start;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 40px #0f1b3320}#login h2{font-size:20px;margin-bottom:14px}#login label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12.5px}#login .btn{width:100%;margin-top:18px;padding:10px}#l_e{color:var(--bad);margin-top:10px;min-height:20px;font-size:13px}#app{display:flex;flex:1;min-width:0}#login .lg{width:240px;max-width:100%;display:block;margin:0 0 18px}.lgbox{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px}.lgbox img{width:100%;display:block}.logo span{display:block;margin-top:6px}
</style>
</head>
<body>
<div id="login" class="hid"><img src="logo.png" alt="Adler Pelzer Group" class="lg"><h2>Product Cost Console</h2><div class="sub">Restricted access</div><label>User ID</label><input id="l_u" type="text" autocomplete="username"><label>Password</label><input id="l_p" type="password" autocomplete="current-password"><button class="btn" onclick="doLogin()">Sign in</button><div id="l_e"></div></div>
<div id="app" class="hid">
<aside>
  <div class="logo"><div class="lgbox"><img src="logo.png" alt="Adler Pelzer Group"></div><span>Product cost · Tangier / Zaragoza</span></div>
  <div id="nav" style="display:flex;flex-direction:column;gap:4px"></div>
  <div class="grow"></div>
  <div class="tools">
    <button onclick="resetData()">⚠ Reset data (admin only)</button>
    <button onclick="saveJSON()">⬇ Save backup (.json)</button>
    <button onclick="document.getElementById('fi').click()">⬆ Load data</button>
    <input id="fi" type="file" accept=".json" style="display:none" onchange="loadJSON(this)">
  </div>
  <div class="mini" style="margin-top:10px">Shared data on the company server.</div>
</aside>
<div class="wrap"><div class="top"><h1 id="title"></h1><span class="sp"></span><span id="stat" class="badge b-de"></span><span class="badge b-t">Tangier</span><span class="badge b-z">Zaragoza</span><b id="who" style="font-size:13px"></b><button id="exitb" class="btn sec hid" onclick="logout()">Sign out</button></div><div id="confl" class="hid" style="padding:12px 28px 0"></div><main id="main"></main></div>
</div>

<script src="config.js"></script>
<script>
/* ======================= EMPTY STATE (no company data in the code) ======================= */
const PL=["TNG","ZGZ"],PN={TNG:"Tangier",ZGZ:"Zaragoza"};
const FLAGS=()=>({dep:false,maint:false,energy:false,cassa:false,indirect:false});
const P0=()=>({days:248,opDays:248,shifts:3,hoursShift:8,paidHours:1744,pause:0,grossYear:0,social:0,energyPrice:0,energyUse:.75,maintPct:.577,burden:0,cassa:0,oee:.85,scrap:.03,ga:.08,profit:.08,produttivita:0,imposte:0,depExcl:false});
function build(){return{name:"ADLER product cost",plants:{TNG:{name:"Tangier",params:P0(),flags:FLAGS(),machines:[]},ZGZ:{name:"Zaragoza",params:P0(),flags:FLAGS(),machines:[]}},materials:[],products:[],notes:{},guide:{excel:[],points:[]},check:null}}
/* fonti per parametro: [chiave, etichetta, UM, fonte Tangeri, fonte Zaragoza, nota] */
const SRC={BC:["Business case","b-bc"],AD:["Adler file","b-ad"],ES:["Estimate · to validate","b-es"],DE:["Calculated","b-de"]};
const NOTE=k=>(S.notes&&S.notes[k])||["ES","ES",""];
const PDEF=[
["Calendar and machine availability",[["days","Machine production days / year","days"],["shifts","Shifts / day","no."],["hoursShift","Hours / shift","h"],["_avail","Available machine hours / year","h","= days × shifts × hours"]]],
["Labour cost",[["grossYear","Gross annual salary, direct operator","€"],["social","Employer social charges","%"],["opDays","Operator working days / year","days"],["paidHours","Paid hours per operator / year","h"],["pause","Non-productive breaks / day","h"],["_net","Net presence hours / month","h","= (paid hours ÷ days − breaks) × days ÷ 12"],["_mod","Direct labour hourly cost (DL)","€/h","= gross × (1 + charges) ÷ (net hours × 12)"],["cassa","Labour inefficiency surcharge","%"]]],
["Energy and maintenance",[["energyPrice","Electricity cost","€/kWh"],["energyUse","Energy utilisation factor","%"],["maintPct","Maintenance (% of hourly depreciation)","%"]]],
["Indirect costs and mark-up",[["burden","Burden rate (indirect ÷ DL)","%"],["oee","Default efficiency / OEE","%"],["scrap","Scrap on subtotal (materials + conversion)","%"],["profit","Profit","%"],["ga","G&A","%"],["produttivita","Productivity","%"],["imposte","Taxes","%"]]]];
const PCT=new Set(["social","energyUse","maintPct","burden","cassa","oee","scrap","profit","ga","produttivita","imposte"]);
const FDEF=[["dep","Depreciation ÷ UR","Adler: no"],["maint","Maintenance ÷ UR","Adler: no"],["energy","Energy ÷ UR","Adler: no"],["cassa","Apply inefficiency surcharge to DL","Adler: yes"],["indirect","Indirect (burden) ÷ UR","Adler: yes – penalises under-loaded machines; enable only with the complete product portfolio loaded"]];

/* ======================= MOTORE ======================= */
let S=build();
let page="dash",selProd=null,tab="TNG",mpl="TNG",uid=1;
const nid=p=>p+Date.now().toString(36)+(uid++);
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const fm=(v,d=2)=>isFinite(v)?v.toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const fp=v=>isFinite(v)?(v*100).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1})+" %":"—";
const sg=v=>isFinite(v)?(v>0?"+":"")+fm(v,3):"—";
function derived(P){const avail=num(P.days)*num(P.shifts)*num(P.hoursShift);
 const net=((num(P.paidHours)/(num(P.opDays)||1))-num(P.pause))*num(P.opDays)/12;
 return{avail,net,mod:num(P.grossYear)*(1+num(P.social))/((net*12)||1)}}
function guOf(m,pl,st=S){if(m.guMode==="manual")return num(m.guManual);
 let sec=0;for(const p of st.products){const v=p.v[pl];if(!v)continue;for(const o of v.ops)if(o.machineId===m.id)sec+=num(v.volume)*num(o.cycle)/(num(o.cav)||1)}
 const avail=derived(st.plants[pl].params).avail*3600*(num(m.qty)||1);return avail?sec/avail:0}
function mrate(m,pl,st=S){const P=st.plants[pl].params,F=st.plants[pl].flags,D=derived(P),gu=guOf(m,pl,st),d=gu>0?gu:1,r={gu};
 const G0=num(m.price)*(1-num(m.resid))/(num(m.life)||1);
 r.G=F.dep?G0/d:G0;r.I=num(P.maintPct)*(F.maint?G0/d:G0);
 const M0=num(m.kw)*num(P.energyUse)*num(P.energyPrice);r.M=F.energy?M0/d:M0;
 r.R=num(m.workers)*D.mod*(F.cassa?1+num(P.cassa):1);r.T=r.R*num(P.burden)/(F.indirect?d:1);
 r.V=r.G+r.I+r.M+r.R+r.T;r.X=r.V-(P.depExcl?r.G:0);r.Y=r.X/60;return r}
function pcalc(p,pl,st=S){const P=st.plants[pl].params,D=derived(P),v=p.v[pl],c={bomRows:[],opRows:[],mat:0,conv:0};
 for(const b of p.bom){const m=st.materials.find(x=>x.id===b.matId);const r=m?num(m.cost[pl])*num(b.qty):0;c.bomRows.push(r);c.mat+=r}
 for(const o of v.ops){const m=o.machineId==="MOD"?null:st.plants[pl].machines.find(x=>x.id===o.machineId);
  const L=num(o.cycle)/(num(o.eff)||1)/(num(o.cav)||1);let rate;
  if(o.crew!==undefined&&o.crew!==null&&o.crew!==""){ // crew defined (CIS): machine part without its generic labour + crew-based labour
   const F=st.plants[pl].flags,mr=m?mrate(m,pl,st):null,lab=num(o.crew)*D.mod*(F.cassa?1+num(P.cassa):1);
   rate=(mr?mr.X-mr.R-mr.T:0)+lab+(m?lab*num(P.burden)/(F.indirect?(mr.gu>0?mr.gu:1):1):0)}
  else rate=m?mrate(m,pl,st).X:D.mod;
  const N=L*rate/3600;c.opRows.push({L,rate,N});c.conv+=N}
 c.sub=c.mat+c.conv;c.scrap=c.sub*num(P.scrap);c.log=num(v.logistic);c.ic=c.sub+c.scrap+c.log;
 const mk=num(P.profit)+num(P.ga)+num(P.produttivita)+num(P.imposte);c.mk=mk;c.markup=c.ic/(1-mk)-c.ic;c.calc=c.ic+c.markup;
 const sp=num(v.price);c.hasPrice=sp>0;c.margin=sp>0?sp-c.ic:NaN;c.marginPct=sp>0?c.margin/sp:NaN;
 c.afterGA=sp>0?c.margin-sp*num(P.ga):NaN;c.afterGApct=sp>0?c.afterGA/sp:NaN;c.beGA=c.ic/(1-num(P.ga));c.matShare=c.calc?c.mat/c.calc:NaN;
 c.complete=v.ops.length>0&&p.bom.length>0;return c}

/* ======================= UTILITÀ UI ======================= */
function setPath(path,v){const k=path.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;save();refresh()}
const setN=(p,v)=>setPath(p,num(v)),setP=(p,v)=>setPath(p,num(v)/100),setT=(p,v)=>setPath(p,v);
const rnd=v=>Math.round(v*1e9)/1e9;
const inN=(p,v,st="any")=>`<input type="number" step="${st}" value="${v}" oninput="setN('${p}',this.value)">`;
const inCrew=(p,v)=>`<input type="number" step="any" placeholder="–" value="${v===undefined||v===null?"":v}" oninput="setPath('${p}',this.value===''?null:num(this.value))">`;
const inP=(p,v)=>`<input type="number" step="any" value="${rnd(v*100)}" oninput="setP('${p}',this.value)">`;
const inT=(p,v)=>`<input type="text" value="${String(v??"").replace(/"/g,"&quot;")}" oninput="setT('${p}',this.value)">`;
const inC=(p,v)=>`<input type="checkbox" ${v?"checked":""} onchange="setPath('${p}',this.checked)" style="width:auto;min-width:0">`;
const O=(e,cls="")=>`<td class="out ${cls}" data-c="${e.replace(/"/g,"&quot;")}"></td>`;
const S_=(e,cls="")=>`<span class="${cls}" data-c="${e.replace(/"/g,"&quot;")}"></span>`;
function refresh(){document.querySelectorAll("[data-c]").forEach(e=>{try{e.innerHTML=eval(e.dataset.c)}catch(x){e.innerHTML="—"}})}
const PAGES=[["dash","▦","Overview"],["inp","⚙","Basic inputs"],["mr","🏭","Machines & processes"],["mat","▤","Materials"],["prd","📦","Products"],["gui","✔","Guide & checks"]];
function render(keep){
 document.getElementById("nav").innerHTML=PAGES.map(([k,i,t])=>`<button class="nv ${(page===k||(page==="pd"&&k==="prd"))?"on":""}" onclick="go('${k}')"><span>${i}</span>${t}</button>`).join("");
 const T={dash:"Overview · Tangier vs Zaragoza",inp:"Basic inputs",mr:"Machines & processes · machine rate",mat:"Materials master",prd:"Products",pd:"Product sheet",gui:"Guide & checks"};
 document.getElementById("title").textContent=T[page];
 document.getElementById("main").innerHTML={dash:pageDash,inp:pageInp,mr:pageMR,mat:pageMat,prd:pagePrd,pd:pagePD,gui:pageGui}[page]();refresh();if(readonly())document.querySelectorAll("#main input,#main select,#main button.btn").forEach(e=>e.disabled=true);if(!keep)window.scrollTo(0,0)}
function go(k){page=k;render()}
function openProd(id,t){selProd=id;if(t)tab=t;page="pd";render()}
function resetData(){if(ME&&ME.ruolo!=="admin"){alert("Only the administrator can reset the data");return}if(!confirm("WARNING: this erases the SHARED data of all users. Continue?"))return;if(!confirm("Confirm again: this cannot be undone (only the history log remains)."))return;S=build();selProd=null;save();go("dash")}
function saveJSON(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="adler_dati_backup.json";a.click()}
function loadJSON(el){const f=el.files[0];if(!f)return;if(readonly()){alert("Read-only account");return}const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.plants||!x.products)throw 0;if(API&&Object.keys(REM).length&&!confirm("The database already contains data: the import REPLACES it for everyone. Continue?"))return;S=Object.assign(build(),x);selProd=null;loaded=true;save();go("dash")}catch(e){alert("Invalid file")}};r.readAsText(f);el.value=""}

/* ======================= PAGINE ======================= */
const COL={mat:"#2563eb",conv:"#0d9488",scrap:"#f59e0b",log:"#8b5cf6",mk:"#94a3b8"};
function stack(c){const t=c.calc||1;const seg=[["Materials",c.mat,COL.mat],["Conversion",c.conv,COL.conv],["Scrap",c.scrap,COL.scrap],["Logistics",c.log,COL.log],["Mark-up (profit + G&A)",c.markup,COL.mk]];
 return `<div class="stack">${seg.map(s=>`<div style="width:${Math.max(0,s[1]/t*100)}%;background:${s[2]}">${s[1]/t>.07?fm(s[1]/t*100,0)+"%":""}</div>`).join("")}</div><div class="legend">${seg.map(s=>`<span><i style="background:${s[2]}"></i>${s[0]} ${fm(s[1],3)} €</span>`).join("")}</div>`}
const stackOf=(ix,pl)=>`stack(pcalc(S.products[${ix}],'${pl}'))`;
const tabs=()=>`<div class="tabs">${[["TNG","Tangier","T"],["ZGZ","Zaragoza","Z"],["CMP","Comparison","C"]].map(x=>`<button class="${tab===x[0]?"on ":""}${x[2]}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join("")}</div>`;

function pageDash(){const P=S.products;let comp={TNG:0,ZGZ:0},mar={TNG:0,ZGZ:0},rev={TNG:0,ZGZ:0};
 const R=P.map(p=>{const r={};for(const pl of PL){r[pl]=pcalc(p,pl);if(r[pl].complete)comp[pl]++;const v=p.v[pl];rev[pl]+=num(v.price)*num(v.volume);if(r[pl].hasPrice)mar[pl]+=r[pl].margin*num(v.volume)}return r});
 const maxv=Math.max(...R.map(r=>Math.max(r.TNG.ic,r.ZGZ.ic)),.01);
 return `<div class="kpi"><div><span>Product codes</span><b>${P.length}</b><small>each with a Tangier and a Zaragoza version</small></div>
 <div><span>Versions with processes entered</span><b>${comp.TNG+comp.ZGZ} / ${P.length*2}</b><small>Tangier ${comp.TNG} · Zaragoza ${comp.ZGZ}</small></div>
 <div><span>Annual margin · Tangier</span><b class="${mar.TNG<0?"neg":""}">${fm(mar.TNG/1e6,2)} M€</b><small>${rev.TNG?fp(mar.TNG/rev.TNG)+" of revenue":"no price entered"}</small></div>
 <div><span>Annual margin · Zaragoza</span><b class="${mar.ZGZ<0?"neg":""}">${fm(mar.ZGZ/1e6,2)} M€</b><small>${rev.ZGZ?fp(mar.ZGZ/rev.ZGZ)+" of revenue":"no price entered"}</small></div></div>
 <div class="card"><h2>Industrial cost by code: Tangier vs Zaragoza</h2><p class="sub">Where a version has no processes entered, the cost includes materials only and is not comparable. Click “Open” for the detailed sheet.</p>

 <tr><td>Break-even price after G&A (IC ÷ (1 − G&A))</td>${O(`fm(${C}.beGA,4)+' €'`)}</tr><tr><td>Material share of calculated price</td>${O(`fp(${C}.matShare)`)}</tr></table></div>
 <div class="card"><h2>4 · Selling price sensitivity · ${PN[pl]}</h2><table style="max-width:760px"><tr><th>Change</th><th class="n">Price €</th><th class="n">Margin €</th><th class="n">Margin %</th><th class="n">After G&A %</th></tr>
 ${[-.1,-.05,0,.05,.1].map(d=>{const pr=`(S.products[${ix}].v.${pl}.price*${1+d})`;return `<tr><td>${d>0?"+":""}${d*100} %</td>${O(`${C}.hasPrice?fm(${pr},4):'—'`)}${O(`${C}.hasPrice?fm(${pr}-${C}.ic,4):'—'`)}${O(`${C}.hasPrice?fp((${pr}-${C}.ic)/${pr}):'—'`)}${O(`${C}.hasPrice?fp((${pr}*(1-S.plants.${pl}.params.ga)-${C}.ic)/${pr}):'—'`)}</tr>`}).join("")}</table></div>`;return h}

/* ======================= EXCEL RECONCILIATION (dataset in shared state) ======================= */
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function runCheck(){const C=S.check;if(!C||!C.state)return null;const A=C.state,pl=Object.keys(A.plants)[0],p=A.products[C.product||0],c=pcalc(p,pl,A);
 let delta=0;for(const i of (C.excelUsesPerMinute||[])){const o=p.v[pl].ops[i],m=A.plants[pl].machines.find(x=>x.id===o.machineId);const r=mrate(m,pl,A);delta+=c.opRows[i].L*(r.X-r.Y)/3600}
 const sc=1+num(A.plants[pl].params.scrap),mk=c.mk;
 const val={mat:c.mat,conv:c.conv-delta,ic:c.ic-delta*sc,calc:c.calc-delta*sc/(1-mk)};
 const out=C.expected.map(e=>{const v=e.what.startsWith("mach:")?mrate(A.plants[pl].machines.find(x=>x.id===e.what.slice(5)),pl,A).X:val[e.what];return{l:e.l,x:e.x,v,ok:Math.abs(e.x-v)<1e-6}});
 out.delta=delta;return out}
function pageGui(){const R=runCheck(),G=S.guide||{excel:[],points:[]};
 let h="";
 if(R)h+=`<div class="card"><h2>Reconciliation with the original Excel file</h2><p class="sub">The engine is re-run on a sheet of the customer Excel file and compared with the values calculated by Excel. It does not touch your data.</p>
 <table style="max-width:860px"><tr><th>Quantity</th><th class="n">Excel</th><th class="n">Console</th><th>Result</th></tr>${R.map(r=>`<tr><td>${esc(r.l)}</td><td class="n">${fm(r.x,6)}</td><td class="n">${fm(r.v,6)}</td><td class="${r.ok?"pass":"fail"}">${r.ok?"OK":"DIFFERENCE"}</td></tr>`).join("")}</table>
 ${(G.excel||[]).map(t=>`<div class="warn">${esc(t)}</div>`).join("")}</div>`;
 else h+=`<div class="info">Excel check not available: no control dataset in the shared data (import the initial data file).</div>`;
 h+=`<div class="card"><h2>Logic of the customer file (Stellantis / Adler)</h2><ol><li><b>Machine rate</b>: €/h = depreciation + maintenance + energy + DL + indirect.</li><li><b>Product breakdown</b>: materials + conversion (cycle time ÷ efficiency ÷ cavities × rate ÷ 3600) + scrap + logistics = <b>industrial cost</b>.</li><li><b>Price</b> = industrial cost ÷ (1 − profit − G&A − productivity − taxes): the mark-up is calculated on the price.</li><li><b>Margin</b> (added here): Sales selling price − industrial cost, and also after G&A.</li></ol></div>
 <div class="card"><h2>Key caveats before using the numbers</h2>${(G.points||[]).length?`<ul>${G.points.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:'<p class="sub">No notes entered.</p>'}</div>
 <div class="card"><h2>Latest changes (shared history)</h2><div id="hist" class="sub">${API?"Loading…":"Available only with the server connected."}</div></div>`;
 if(API)setTimeout(loadHistory,50);return h}
async function loadHistory(){try{const r=await call("apiHistory",60);const el=document.getElementById("hist");if(!el)return;
 el.innerHTML=`<table><tr><th>Date / time</th><th>User</th><th>Item</th><th class="n">Version</th><th>Action</th></tr>${r.map(x=>`<tr><td>${esc(x.ts)}</td><td>${esc(x.user)}</td><td>${esc(x.key)}</td><td class="n">${esc(x.v)}</td><td>${esc(x.action)}</td></tr>`).join("")}</table>`}catch(e){}}

/* ======================= ACCESSO, DATI CONDIVISI, SALVATAGGIO ======================= */
const API=window.ADLER_API||"";
let TOKEN="",ME=null,REM={},conflicts={},timer=null,busy=false,loaded=false,pendingRender=false,pollT=null;
try{TOKEN=sessionStorage.getItem("adl_t")||"";ME=JSON.parse(sessionStorage.getItem("adl_u")||"null")}catch(e){}
const readonly=()=>ME&&ME.ruolo==="viewer";
async function call(fn,...args){let r;try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args,token:TOKEN})})}catch(e){throw new Error("Server unreachable")}
 const j=await r.json();if(j.status===401&&fn!=="apiLogin"){logout(true);throw new Error("Session expired")}if(j.error)throw new Error(j.error);return j.data}
function setStatus(t,bad){const e=document.getElementById("stat");if(e){e.textContent=t;e.className="badge "+(bad?"b-es":"b-bc")}}
function docsOf(st){const d={meta:{name:st.name||"",ids:st.products.map(p=>p.id)},notes:st.notes||{},guide:st.guide||{},materials:st.materials};if(st.check)d.check=st.check;for(const k of PL)d["plant:"+k]=st.plants[k];for(const p of st.products)d["prod:"+p.id]=p;return d}
function applyDoc(k,val){if(k==="meta"){S.name=val.name;S._ids=val.ids;S.products.sort((a,b)=>S._ids.indexOf(a.id)-S._ids.indexOf(b.id))}
 else if(k==="notes")S.notes=val;else if(k==="guide")S.guide=val;else if(k==="check")S.check=val;else if(k==="materials")S.materials=val;
 else if(k.startsWith("plant:"))S.plants[k.slice(6)]=val;
 else if(k.startsWith("prod:")){const i=S.products.findIndex(p=>p.id===val.id);if(i>=0)S.products[i]=val;else S.products.push(val);if(S._ids)S.products.sort((a,b)=>S._ids.indexOf(a.id)-S._ids.indexOf(b.id))}}
function dropDoc(k){if(k.startsWith("prod:"))S.products=S.products.filter(p=>"prod:"+p.id!==k)}
function save(){if(!API){try{localStorage.setItem("adlerLocal",JSON.stringify(S))}catch(e){}return}
 if(readonly()||!loaded)return;setStatus("unsaved changes…",true);clearTimeout(timer);timer=setTimeout(flush,1500)}
async function flush(){if(busy){timer=setTimeout(flush,800);return}busy=true;
 try{const d=docsOf(S);
  for(const [k,val] of Object.entries(d)){const js=JSON.stringify(val);if(REM[k]&&REM[k].json===js)continue;if(conflicts[k])continue;
   const r=await call("apiSaveDoc",k,js,REM[k]?REM[k].v:0);
   if(r.conflict){conflicts[k]=r.current;showConflicts()}else REM[k]={v:r.v,json:js}}
  for(const k of Object.keys(REM))if(!(k in d)&&!conflicts[k]){await call("apiDeleteDoc",k,REM[k].v);delete REM[k]}
  if(!Object.keys(conflicts).length)setStatus("saved "+new Date().toLocaleTimeString("en-GB"))}
 catch(e){setStatus("SAVE ERROR: "+e.message,true)}busy=false}
function showConflicts(){const ks=Object.keys(conflicts),el=document.getElementById("confl");if(!ks.length){el.classList.add("hid");return}
 el.classList.remove("hid");el.innerHTML=ks.map(k=>`<div class="warn"><b>Conflict on “${esc(k)}”</b>: ${esc(conflicts[k].by)} saved a newer version (${esc(conflicts[k].ts)}). <button class="btn sec" onclick="resolve('${esc(k)}','theirs')">Use their version (I lose my changes)</button> <button class="btn" onclick="resolve('${esc(k)}','mine')">Overwrite with mine</button></div>`).join("");setStatus("conflict to resolve",true)}
function resolve(k,how){const c=conflicts[k];delete conflicts[k];REM[k]={v:c.v,json:c.json};if(how==="theirs")applyDoc(k,JSON.parse(c.json));showConflicts();softRender();if(how==="mine")flush()}
function softRender(){if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){pendingRender=true;return}pendingRender=false;const y=window.scrollY;render(true);window.scrollTo(0,y)}
document.addEventListener("focusout",()=>{if(pendingRender)setTimeout(softRender,200)});
async function poll(){if(!TOKEN||!loaded||busy)return;
 try{const known={};for(const k in REM)known[k]=REM[k].v;const r=await call("apiPoll",known);let ch=false;
  for(const [k,d] of Object.entries(r.changed)){const mine=JSON.stringify(docsOf(S)[k]);const dirty=REM[k]&&mine!==REM[k].json;
   if(dirty){conflicts[k]=d;showConflicts()}else{REM[k]={v:d.v,json:d.json};applyDoc(k,JSON.parse(d.json));ch=true;setStatus("updated by "+d.by+" · "+d.ts.slice(11,16))}}
  for(const k of Object.keys(REM))if(!r.keys.includes(k)){const dirty=docsOf(S)[k]!==undefined&&JSON.stringify(docsOf(S)[k])!==REM[k].json;if(!dirty){delete REM[k];dropDoc(k);ch=true}}
  if(ch)softRender()}catch(e){}}
async function loadAll(){const r=await call("apiLoadAll");REM={};const keys=Object.keys(r.docs);
 if(!keys.length){S=build();loaded=true;setStatus(readonly()?"database empty":"database empty: import the initial data (⬆ Load data)",true);return}
 S=build();S.products=[];S.materials=[];for(const k of keys){REM[k]={v:r.docs[k].v,json:r.docs[k].json}}
 for(const k of ["notes","guide","check","materials","plant:TNG","plant:ZGZ"])if(REM[k])applyDoc(k,JSON.parse(REM[k].json));
 for(const k of keys)if(k.startsWith("prod:"))applyDoc(k,JSON.parse(REM[k].json));
 if(REM.meta)applyDoc("meta",JSON.parse(REM.meta.json));loaded=true;setStatus("data loaded "+new Date().toLocaleTimeString("en-GB"))}
async function doLogin(){const u=document.getElementById("l_u").value.trim(),p=document.getElementById("l_p").value,e=document.getElementById("l_e");e.textContent="";
 try{const r=await call("apiLogin",u,p);TOKEN=r.token;ME={nome:r.nome,ruolo:r.ruolo};try{sessionStorage.setItem("adl_t",TOKEN);sessionStorage.setItem("adl_u",JSON.stringify(ME))}catch(x){}await start()}catch(x){e.textContent=x.message}}
function logout(silent){TOKEN="";ME=null;loaded=false;clearInterval(pollT);try{sessionStorage.removeItem("adl_t");sessionStorage.removeItem("adl_u")}catch(e){}showLogin(silent?"Session expired: please sign in again.":"")}
function showLogin(msg){document.getElementById("app").classList.add("hid");const l=document.getElementById("login");l.classList.remove("hid");document.getElementById("l_e").textContent=msg||"";document.getElementById("l_p").value=""}
async function start(){document.getElementById("login").classList.add("hid");document.getElementById("app").classList.remove("hid");
 document.getElementById("who").textContent=ME?ME.nome+" · "+ME.ruolo:"local mode";document.getElementById("exitb").classList.toggle("hid",!API);
 try{await loadAll()}catch(e){setStatus("ERROR: "+e.message,true)}render();clearInterval(pollT);pollT=setInterval(poll,15000)}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement.id==="l_p")doLogin()});
if(!API){try{const x=JSON.parse(localStorage.getItem("adlerLocal")||"null");if(x&&x.plants)S=x}catch(e){}ME={nome:"Local",ruolo:"admin"};loaded=true;start().then(()=>setStatus("local mode (no server connected)",true))}
else if(TOKEN&&ME)start();else showLogin();
</script>
</body>
