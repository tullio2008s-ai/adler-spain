<!DOCTYPE html>

<style>

*{box-sizing:border-box}html,body{margin:0}

code{background:#eef1f7;padding:1px 5px;border-radius:4px;font-size:12.5px}

li{margin:4px 0}
@media(max-width:860px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}.logo{display:none}aside .grow,aside .mini,aside .tools{display:none}main,.top{padding:14px}}
.hid{display:none!important}#login{width:380px;max-width:92vw;align-self:flex-start;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 40px #0f1b3320}#login h2{font-size:20px;margin-bottom:14px}#login label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12.5px}#login .btn{width:100%;margin-top:18px;padding:10px}#l_e{color:var(--bad);margin-top:10px;min-height:20px;font-size:13px}#app{display:flex;flex:1;min-width:0}#login .lg{width:240px;max-width:100%;display:block;margin:0 0 18px}.lgbox{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px}.lgbox img{width:100%;display:block}.logo span{display:block;margin-top:6px}
</style>

<div id="pastebox" class="hid" style="position:fixed;inset:0;background:#0f1b3399;z-index:50;display:flex;align-items:center;justify-content:center"><div style="background:#fff;border-radius:14px;padding:20px;width:min(760px,92vw)"><h2>Paste data (JSON)</h2><p class="sub">Paste the full JSON text and click Import. In a shared database it replaces the current data for everyone.</p><textarea id="pastetxt" style="width:100%;height:280px;font:12px monospace"></textarea><div class="row" style="justify-content:flex-end"><button class="btn sec" onclick="closePaste()">Cancel</button><button class="btn" onclick="doPaste()">Import</button></div></div></div>

<aside>
  <div class="logo"><div class="lgbox"><img src="logo.png" alt="Adler Pelzer Group"></div><span>Product cost · Tangier / Zaragoza</span></div>

<script>
/* ======================= EMPTY STATE (no company data in the code) ======================= */
const PL=["TNG","ZGZ"],PN={TNG:"Tangier",ZGZ:"Zaragoza"};
const FLAGS=()=>({dep:false,maint:false,energy:false,cassa:false,indirect:false,burdenManual:false});
const P0=()=>({days:248,opDays:248,shifts:3,hoursShift:8,paidHours:1744,pause:0,grossYear:0,social:0,energyPrice:0,energyUse:.75,maintPct:.577,burden:0,cassa:0,oee:.85,scrap:.03,ga:.08,profit:.08,produttivita:0,imposte:0,depExcl:false,burdenMode:"manual",maintMode:"manual"});
function build(){return{name:"ADLER product cost",plants:{TNG:{name:"Tangier",params:P0(),flags:FLAGS(),machines:[],dlBase:0,items:[]},ZGZ:{name:"Zaragoza",params:P0(),flags:FLAGS(),machines:[],dlBase:0,items:[]}},materials:[],products:[],notes:{},guide:{excel:[],points:[]},check:null}}
/* fonti per parametro: [chiave, etichetta, UM, fonte Tangeri, fonte Zaragoza, nota] */
const SRC={BC:["Business case","b-bc"],AD:["Adler file","b-ad"],ES:["Estimate · to validate","b-es"],DE:["Calculated","b-de"]};
const NOTE=k=>(S.notes&&S.notes[k])||["ES","ES",""];
const PDEF=[
["Calendar and machine availability",[["days","Machine production days / year","days"],["shifts","Shifts / day","no."],["hoursShift","Hours / shift","h"],["_avail","Available machine hours / year","h","= days × shifts × hours"]]],
["Labour cost",[["grossYear","Gross annual salary, direct operator","€"],["social","Employer social charges","%"],["opDays","Operator working days / year","days"],["paidHours","Paid hours per operator / year","h"],["pause","Non-productive breaks / day","h"],["_net","Net presence hours / month","h","= (paid hours ÷ days − breaks) × days ÷ 12"],["_mod","Direct labour hourly cost (DL)","€/h","= gross × (1 + charges) ÷ (net hours × 12)"],["cassa","Labour inefficiency surcharge","%"]]],
["Energy and maintenance",[["energyPrice","Electricity cost","€/kWh"],["energyUse","Energy utilisation factor","%"],["maintPct","Maintenance – manual value (% of hourly depreciation)","%"],["_maintEff","Maintenance % IN USE","%","= manual value, or computed from the burden split"]]],
["Indirect costs and mark-up",[["burden","Burden rate – manual value (indirect ÷ DL)","%"],["_burdenEff","Burden rate IN USE","%","= manual value, or computed from the burden split (page “Burden & rates”)"],["oee","Default efficiency / OEE","%"],["scrap","Scrap on subtotal (materials + conversion)","%"],["profit","Profit","%"],["ga","G&A","%"],["produttivita","Productivity","%"],["imposte","Taxes","%"]]]];
const PCT=new Set(["social","energyUse","maintPct","burden","cassa","oee","scrap","profit","ga","produttivita","imposte"]);
const FDEF=[["dep","Depreciation ÷ UR","Adler: no"],["maint","Maintenance ÷ UR","Adler: no"],["energy","Energy ÷ UR","Adler: no"],["cassa","Apply inefficiency surcharge to DL","Adler: yes"],["indirect","Indirect (burden) ÷ UR","Adler: yes – penalises under-loaded machines; enable only with the complete product portfolio loaded"],["burdenManual","Apply burden also to manual (DL-only) operations","Adler: no (manual steps use direct labour cost only)"]];

/* ======================= MOTORE ======================= */
let S=build();
let page="dash",selProd=null,tab="TNG",mpl="TNG",bpl="TNG",uid=1;
const nid=p=>p+Date.now().toString(36)+(uid++);
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const fm=(v,d=2)=>isFinite(v)?v.toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const fp=v=>isFinite(v)?(v*100).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1})+" %":"—";
const sg=v=>isFinite(v)?(v>0?"+":"")+fm(v,3):"—";
function derived(P){const avail=num(P.days)*num(P.shifts)*num(P.hoursShift);
 const net=((num(P.paidHours)/(num(P.opDays)||1))-num(P.pause))*num(P.opDays)/12;
 return{avail,net,mod:num(P.grossYear)*(1+num(P.social))/((net*12)||1)}}
function guOf(m,pl,st=S){if(m.guMode==="manual")return num(m.guManual);
 let sec=0;for(const p of st.products){const v=p.v[pl];if(!v)continue;for(const o of v.ops)if(o.machineId===m.id)sec+=num(v.volume)*num(o.cycle)/(num(o.cav)||1)}
 const avail=derived(st.plants[pl].params).avail*3600*(num(m.qty)||1);return avail?sec/avail:0}
const CLS={BURDEN:"Burden",GA:"G&A",MAINT:"Maintenance",ENERGY:"Energy (info)",DL:"Direct labour (base)",EXCL:"Excluded"};
function depAnnual(pl,st=S){const p=st.plants[pl],av=derived(p.params).avail;return p.machines.reduce((a,m)=>a+num(m.qty)*num(m.price)*(1-num(m.resid))*av/(num(m.life)||1),0)}
function burdenCalc(pl,st=S){const p=st.plants[pl],t={BURDEN:0,GA:0,MAINT:0,ENERGY:0,DL:0,EXCL:0};for(const i of (p.items||[]))t[i.cls]=(t[i.cls]||0)+num(i.annual);
 const rev=st.products.reduce((a,x)=>a+(x.v[pl]?num(x.v[pl].price)*num(x.v[pl].volume):0),0),dep=depAnnual(pl,st),dl=num(p.dlBase);
 return{t,rev,dep,dl,burdenRate:dl>0?t.BURDEN/dl:NaN,maintRate:dep>0?t.MAINT/dep:NaN,gaPct:rev>0?t.GA/rev:NaN}}
function effP(pl,st=S){const p=st.plants[pl],P=p.params,B=burdenCalc(pl,st);let burden=num(P.burden),maint=num(P.maintPct);
 if(P.burdenMode==="split"&&isFinite(B.burdenRate))burden=B.burdenRate;if(P.maintMode==="split"&&isFinite(B.maintRate))maint=B.maintRate;return{burden,maint,B}}
function mrate(m,pl,st=S){const P=st.plants[pl].params,F=st.plants[pl].flags,D=derived(P),E=effP(pl,st),gu=guOf(m,pl,st),d=gu>0?gu:1,r={gu};
 const G0=num(m.price)*(1-num(m.resid))/(num(m.life)||1);
 r.G=F.dep?G0/d:G0;r.I=E.maint*((F.maint&&!F.dep)?G0/d:r.G);
 const M0=num(m.kw)*num(P.energyUse)*num(P.energyPrice);r.M=F.energy?M0/d:M0;
 r.R=num(m.workers)*D.mod*(F.cassa?1+num(P.cassa):1);r.T=r.R*E.burden/(F.indirect?d:1);
 r.V=r.G+r.I+r.M+r.R+r.T;r.X=r.V-(P.depExcl?r.G:0);r.Y=r.X/60;return r}
function opCalc(o,pl,st=S){const P=st.plants[pl].params,F=st.plants[pl].flags,D=derived(P),E=effP(pl,st);
 const m=o.machineId==="MOD"?null:st.plants[pl].machines.find(x=>x.id===o.machineId),mr=m?mrate(m,pl,st):null;
 const hasCrew=o.crew!==undefined&&o.crew!==null&&o.crew!=="";let G=0,I=0,M=0,R=0,T=0;
 if(mr){G=P.depExcl?0:mr.G;I=mr.I;M=mr.M;if(hasCrew){R=num(o.crew)*D.mod*(F.cassa?1+num(P.cassa):1);T=R*E.burden/(F.indirect?(mr.gu>0?mr.gu:1):1)}else{R=mr.R;T=mr.T}}
 else{R=hasCrew?num(o.crew)*D.mod*(F.cassa?1+num(P.cassa):1):D.mod;T=F.burdenManual?R*E.burden:0}
 const L=num(o.cycle)/(num(o.eff)||1)/(num(o.cav)||1),rate=G+I+M+R+T,f=L/3600;
 const heads=hasCrew?num(o.crew):(m?num(m.workers):num(o.cav));
 return{L,rate,N:f*rate,G,I,M,R,T,nG:f*G,nI:f*I,nM:f*M,nR:f*R,nT:f*T,heads,hasCrew,mname:m?m.name:"Manual DL",gu:mr?mr.gu:0}}
function pcalc(p,pl,st=S){const P=st.plants[pl].params,D=derived(P),v=p.v[pl],c={bomRows:[],opRows:[],mat:0,conv:0};
 for(const b of p.bom){const m=st.materials.find(x=>x.id===b.matId);const r=m?num(m.cost[pl])*num(b.qty):0;c.bomRows.push(r);c.mat+=r}
 c.cG=c.cI=c.cM=c.cR=c.cT=0;c.heads=0;c.dlMin=0;
 for(const o of v.ops){const r=opCalc(o,pl,st);c.opRows.push(r);c.conv+=r.N;c.cG+=r.nG;c.cI+=r.nI;c.cM+=r.nM;c.cR+=r.nR;c.cT+=r.nT;c.heads+=r.heads;c.dlMin+=r.heads*r.L/60}
 c.sub=c.mat+c.conv;c.scrap=c.sub*num(P.scrap);c.log=num(v.logistic);c.ic=c.sub+c.scrap+c.log;
 const mk=num(P.profit)+num(P.ga)+num(P.produttivita)+num(P.imposte);c.mk=mk;c.markup=c.ic/(1-mk)-c.ic;c.calc=c.ic+c.markup;
 const sp=num(v.price);c.hasPrice=sp>0;c.margin=sp>0?sp-c.ic:NaN;c.marginPct=sp>0?c.margin/sp:NaN;
 c.afterGA=sp>0?c.margin-sp*num(P.ga):NaN;c.afterGApct=sp>0?c.afterGA/sp:NaN;c.beGA=c.ic/(1-num(P.ga));c.matShare=c.calc?c.mat/c.calc:NaN;
 c.complete=v.ops.length>0&&p.bom.length>0;return c}

/* ======================= UTILITÀ UI ======================= */
function setPath(path,v){const k=path.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v;save();refresh()}
const setN=(p,v)=>setPath(p,num(v)),setP=(p,v)=>setPath(p,num(v)/100),setT=(p,v)=>setPath(p,v);
const rnd=v=>Math.round(v*1e9)/1e9;
const inN=(p,v,st="any")=>`<input type="number" step="${st}" value="${v}" oninput="setN('${p}',this.value)">`;
const inCrew=(p,v)=>`<input type="number" step="any" placeholder="–" value="${v===undefined||v===null?"":v}" oninput="setPath('${p}',this.value===''?null:num(this.value))">`;
const inP=(p,v)=>`<input type="number" step="any" value="${rnd(v*100)}" oninput="setP('${p}',this.value)">`;
const inT=(p,v)=>`<input type="text" value="${String(v??"").replace(/"/g,"&quot;")}" oninput="setT('${p}',this.value)">`;
const inC=(p,v)=>`<input type="checkbox" ${v?"checked":""} onchange="setPath('${p}',this.checked)" style="width:auto;min-width:0">`;
const O=(e,cls="")=>`<td class="out ${cls}" data-c="${e.replace(/"/g,"&quot;")}"></td>`;
const S_=(e,cls="")=>`<span class="${cls}" data-c="${e.replace(/"/g,"&quot;")}"></span>`;
function refresh(){document.querySelectorAll("[data-c]").forEach(e=>{try{e.innerHTML=eval(e.dataset.c)}catch(x){e.innerHTML="—"}})}
const PAGES=[["dash","▦","Overview"],["inp","⚙","Basic inputs"],["bur","⚖","Burden & rates"],["mr","🏭","Machines & processes"],["mat","▤","Materials"],["prd","📦","Products"],["gui","✔","Guide & checks"]];
function render(keep){
 document.getElementById("nav").innerHTML=PAGES.map(([k,i,t])=>`<button class="nv ${(page===k||(page==="pd"&&k==="prd"))?"on":""}" onclick="go('${k}')"><span>${i}</span>${t}</button>`).join("");
 const T={dash:"Overview · Tangier vs Zaragoza",inp:"Basic inputs",bur:"Burden split & hourly rates",mr:"Machines & processes · machine rate",mat:"Materials master",prd:"Products",pd:"Product sheet",gui:"Guide & checks"};
 document.getElementById("title").textContent=T[page];
 document.getElementById("main").innerHTML={dash:pageDash,inp:pageInp,bur:pageBur,mr:pageMR,mat:pageMat,prd:pagePrd,pd:pagePD,gui:pageGui}[page]();refresh();if(readonly())document.querySelectorAll("#main input,#main select,#main button.btn:not([data-ok])").forEach(e=>e.disabled=true);if(!keep)window.scrollTo(0,0)}

async function loadSeed(){if(readonly()){alert("Read-only account");return}
 const pw=window.prompt("Passphrase of the initial data:");if(!pw)return;let x;
 try{const j=await (await fetch("seed.enc.json?"+Date.now())).json(),b=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(j.salt),iterations:j.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  x=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(j.iv)},key,b(j.data))))}
 catch(e){alert("Wrong passphrase, or the data file is not available");return}
 if(API&&Object.keys(REM).length&&!confirm("The database already contains data: the import REPLACES it for everyone. Continue?"))return;
 S=Object.assign(build(),x);selProd=null;loaded=true;save();go("dash")}

function loadJSON(el){const f=el.files[0];if(!f)return;if(readonly()){alert("Read-only account");return}const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.plants||!x.products)throw 0;if(API&&Object.keys(REM).length&&!confirm("The database already contains data: the import REPLACES it for everyone. Continue?"))return;S=Object.assign(build(),x);selProd=null;loaded=true;save();go("dash")}catch(e){alert("Invalid file")}};r.readAsText(f);el.value=""}

 const maxv=Math.max(...R.map(r=>Math.max(r.TNG.ic,r.ZGZ.ic)),.01);
 return `<div class="kpi"><div><span>Product codes</span><b>${P.length}</b><small>each with a Tangier and a Zaragoza version</small></div>

 <div><span>Annual margin · Tangier</span><b class="${mar.TNG<0?"neg":""}">${fm(mar.TNG/1e6,2)} M€</b><small>${rev.TNG?fp(mar.TNG/rev.TNG)+" of revenue":"no price entered"}</small></div>
 <div><span>Annual margin · Zaragoza</span><b class="${mar.ZGZ<0?"neg":""}">${fm(mar.ZGZ/1e6,2)} M€</b><small>${rev.ZGZ?fp(mar.ZGZ/rev.ZGZ)+" of revenue":"no price entered"}</small></div></div>
 <div class="card"><h2>Industrial cost by code: Tangier vs Zaragoza</h2><p class="sub">Where a version has no processes entered, the cost includes materials only and is not comparable. Click “Open” for the detailed sheet.</p>

 <td class="n t">${fm(t.ic,3)} ${t.complete?"":'<span class="badge b-es">materials only</span>'}</td><td class="n z">${fm(z.ic,3)} ${z.complete?"":'<span class="badge b-es">materials only</span>'}</td><td class="n ${ok?(z.ic-t.ic>0?"neg":"pos"):""}">${ok?sg(z.ic-t.ic):"—"}</td>
 <td><div class="bar"><i style="width:${t.ic/maxv*100}%;background:#c2410c"></i></div><div class="bar"><i style="width:${z.ic/maxv*100}%;background:#1d4ed8"></i></div></td>
 <td class="n t ${t.margin<0?"neg":""}">${fp(t.marginPct)}</td><td class="n z ${z.margin<0?"neg":""}">${fp(z.marginPct)}</td><td><button class="btn sec" onclick="openProd('${p.id}','CMP')">Open</button></td></tr>`}).join("")}</table>
 <div class="row"><button class="btn sec" onclick="exportCSV()">⬇ Export table (CSV)</button><button class="btn sec" data-ok="1" onclick="reportPDF(false)">⬇ PDF summary report</button><button class="btn sec" data-ok="1" onclick="reportPDF(true)">⬇ PDF full report</button></div></div>`}

 h+=`<div class="card"><h2>How fixed costs are charged to machines</h2><p class="sub">UR = machine utilisation rate (volumes × times ÷ available hours).</p><table><tr><th>Option</th><th class="t">Tangier</th><th class="z">Zaragoza</th><th>Note</th></tr>`;

 h+=`<tr><td>Fully depreciated plant (exclude depreciation from the rate)</td><td class="t">${inC("plants.TNG.params.depExcl",S.plants.TNG.params.depExcl)}</td><td class="z">${inC("plants.ZGZ.params.depExcl",S.plants.ZGZ.params.depExcl)}</td><td style="color:#6b7590">Adler “DEPRECIATION”</td></tr></table></div>`;return h}

  {const BT={TNG:burdenCalc("TNG"),ZGZ:burdenCalc("ZGZ")},EE={TNG:effP("TNG"),ZGZ:effP("ZGZ")};if(y>H-200){doc.addPage();y=60}
   y=h2("Burden split and hourly rates",y);
   y=tbl({startY:y,head:[["Item","Tangier","Zaragoza"]],body:[ar("Burden total / year (EUR)",k=>fm(BT[k].t.BURDEN,0)),ar("Direct labour base / year (EUR)",k=>fm(BT[k].dl,0)),ar("Burden rate computed",k=>pp(BT[k].burdenRate)),ar("Burden rate in use",k=>pp(EE[k].burden)),ar("G&A total / year (EUR)",k=>fm(BT[k].t.GA,0)),ar("G&A implied on revenue",k=>pp(BT[k].gaPct)),ar("Maintenance items / year (EUR)",k=>fm(BT[k].t.MAINT,0)),ar("Machine depreciation / year (EUR)",k=>fm(BT[k].dep,0)),ar("Maintenance % computed / in use",k=>pp(BT[k].maintRate)+" / "+pp(EE[k].maint))],columnStyles:{0:{cellWidth:260},1:{halign:"right"},2:{halign:"right"}},tableWidth:520})+14}
 }else y=head("Product sheet - "+prods[0].code,prods[0].desc);
 if(!onlyId){
  if(y>H-150){doc.addPage();y=60}
  y=h2("Products - industrial cost, price and margin (EUR/pc)",y);
  let rev={TNG:0,ZGZ:0},mar={TNG:0,ZGZ:0};
  const body=prods.map((p,i)=>{const t=C[i].TNG,z=C[i].ZGZ;for(const k of PL){const c=C[i][k],v=p.v[k];rev[k]+=num(v.price)*num(v.volume);if(c.hasPrice)mar[k]+=c.margin*num(v.volume)}
   return [p.code,p.desc,fm(p.v.TNG.volume,0),pf(t.ic)+(t.complete?"":"*"),pf(z.ic)+(z.complete?"":"*"),(t.complete&&z.complete)?sg(z.ic-t.ic):"-",t.hasPrice?pf(p.v.TNG.price):"-",z.hasPrice?pf(p.v.ZGZ.price):"-",pp(t.marginPct),pp(z.marginPct)]});
  body.push([{content:"Annual revenue / margin on priced products (EUR)",colSpan:3,styles:{fontStyle:"bold"}},{content:"Tangier: "+fm(rev.TNG,0)+" / "+fm(mar.TNG,0),colSpan:3,styles:{fontStyle:"bold",textColor:TNGc}},{content:"Zaragoza: "+fm(rev.ZGZ,0)+" / "+fm(mar.ZGZ,0),colSpan:4,styles:{fontStyle:"bold",textColor:ZGZc}}]);
  y=tbl({startY:y,head:[["Code","Description","Volume","Ind. cost T","Ind. cost Z","Diff Z-T","Price T","Price Z","Margin T","Margin Z"]],body,
   columnStyles:{2:{halign:"right"},3:{halign:"right"},4:{halign:"right"},5:{halign:"right"},6:{halign:"right"},7:{halign:"right"},8:{halign:"right"},9:{halign:"right"}}})+6;
  doc.setFontSize(7.5).setTextColor(90).text("* materials only: no processes entered for that version (not comparable).  T = Tangier, Z = Zaragoza.  Margin = selling price - industrial cost, as % of price.",M,y+6);
  const pts=(S.guide&&S.guide.points)||[];
  if(pts.length){doc.addPage();y=60;y=h2("Key caveats",y);doc.setFont("helvetica","normal").setFontSize(8.5).setTextColor(40);
   for(const t of pts){const ls=doc.splitTextToSize("- "+t,W-2*M);if(y+ls.length*11>H-40){doc.addPage();y=60}doc.text(ls,M,y+12);y+=ls.length*11+6}}
 }
 if(full){
  prods.forEach((p,i)=>{
   if(!onlyId){doc.addPage();y=head("Product sheet - "+p.code,p.desc)}
   const t=C[i].TNG,z=C[i].ZGZ,row=(l,k,b)=>[{content:l,styles:b?{fontStyle:"bold"}:{}},pf(t[k]),pf(z[k]),sg(z[k]-t[k])];
   y=h2((p.customer||"")+" "+(p.project||"")+"  |  Annual volume: "+fm(p.v.TNG.volume,0)+" pcs",y+4);
   y=tbl({startY:y,head:[["Cost build-up (EUR/pc)","Tangier","Zaragoza","Diff Z-T"]],body:[row("Raw materials / components","mat"),row("Conversion (machine rate x times, crew)","conv"),row("   depreciation","cG"),row("   maintenance","cI"),row("   energy","cM"),row("   direct labour","cR"),row("   burden","cT"),row("Operators in the route","heads"),row("Direct labour min / pc","dlMin"),row("Subtotal","sub",1),row("Scrap","scrap"),row("Logistics","log"),row("INDUSTRIAL COST","ic",1),row("Mark-up","markup"),row("PRICE CALCULATED FROM BREAKDOWN","calc",1),
    ["Selling price (Sales)",t.hasPrice?pf(p.v.TNG.price):"-",z.hasPrice?pf(p.v.ZGZ.price):"-",""],["Margin (price - industrial cost)",t.hasPrice?pf(t.margin):"-",z.hasPrice?pf(z.margin):"-",""],["Margin %",pp(t.marginPct),pp(z.marginPct),""]],
    columnStyles:{0:{cellWidth:250},1:{halign:"right"},2:{halign:"right"},3:{halign:"right"}},tableWidth:520})+12;
   if(p.bom.length)y=tbl({startY:y,head:[["Bill of materials","UoM","Qty / pc","Unit cost T","Unit cost Z","EUR/pc T","EUR/pc Z"]],body:p.bom.map((b,j)=>{const m=S.materials.find(x=>x.id===b.matId)||{};return[(m.code||"")+" "+(m.desc||""),m.unit||"",fm(b.qty,4),m.cost?fm(m.cost.TNG,4):"-",m.cost?fm(m.cost.ZGZ,4):"-",fm(t.bomRows[j],4),fm(z.bomRows[j],4)]}),columnStyles:{2:{halign:"right"},3:{halign:"right"},4:{halign:"right"},5:{halign:"right"},6:{halign:"right"}}})+12;
   for(const k of PL){const c=C[i][k],v=p.v[k];if(!v.ops.length)continue;if(y>H-120){doc.addPage();y=60}
    y=tbl({startY:y,head:[["Processes - "+PN[k],"Machine","Operators","Cycle (s)","Eff.","Ref. (s)","Depr.","Maint.","Energy","Labour","Burden","Rate EUR/h","EUR/pc"]],headStyles:{fillColor:k==="TNG"?TNGc:ZGZc,textColor:255},
     body:v.ops.map((o,j)=>{const r=c.opRows[j];return[o.desc,r.mname,fm(r.heads,2),fm(o.cycle,0),pp(o.eff),fm(r.L,1),fm(r.G,2),fm(r.I,2),fm(r.M,2),fm(r.R,2),fm(r.T,2),fm(r.rate,2),fm(r.N,4)]}).concat([[{content:"Total per piece (EUR): depr "+fm(c.cG,3)+" | maint "+fm(c.cI,3)+" | energy "+fm(c.cM,3)+" | labour "+fm(c.cR,3)+" | burden "+fm(c.cT,3)+" | operators "+fm(c.heads,2),colSpan:12,styles:{fontStyle:"bold"}},{content:fm(c.conv,4),styles:{fontStyle:"bold"}}]]),
     columnStyles:{2:{halign:"right"},3:{halign:"right"},4:{halign:"right"},5:{halign:"right"},6:{halign:"right"},7:{halign:"right"},8:{halign:"right"},9:{halign:"right"},10:{halign:"right"},11:{halign:"right"},12:{halign:"right"}}})+10}
   if(p.notes){if(y>H-60){doc.addPage();y=60}doc.setFont("helvetica","italic").setFontSize(7.5).setTextColor(90);doc.text(doc.splitTextToSize("Notes: "+p.notes,W-2*M),M,y+8)}
  });
 }
 const n=doc.internal.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal").setFontSize(7.5).setTextColor(130).text("ADLER Pelzer Group - Product cost console  |  page "+i+" / "+n+"  |  confidential",M,H-18)}
 doc.save(onlyId?("product_"+prods[0].code.replace(/[^A-Za-z0-9_-]/g,"_")+".pdf"):(full?"product_cost_full_report.pdf":"product_cost_summary.pdf"))}

/* ======================= ACCESSO, DATI CONDIVISI, SALVATAGGIO ======================= */
const API=window.ADLER_API||"";
let TOKEN="",ME=null,REM={},conflicts={},timer=null,busy=false,loaded=false,pendingRender=false,pollT=null;
try{TOKEN=sessionStorage.getItem("adl_t")||"";ME=JSON.parse(sessionStorage.getItem("adl_u")||"null")}catch(e){}
const readonly=()=>ME&&ME.ruolo==="viewer";
async function call(fn,...args){let r;try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args,token:TOKEN})})}catch(e){throw new Error("Server unreachable")}
 const j=await r.json();if(j.status===401&&fn!=="apiLogin"){logout(true);throw new Error("Session expired")}if(j.error)throw new Error(j.error);return j.data}
function setStatus(t,bad){const e=document.getElementById("stat");if(e){e.textContent=t;e.className="badge "+(bad?"b-es":"b-bc")}}
function docsOf(st){const d={meta:{name:st.name||"",ids:st.products.map(p=>p.id)},notes:st.notes||{},guide:st.guide||{},materials:st.materials};if(st.check)d.check=st.check;for(const k of PL)d["plant:"+k]=st.plants[k];for(const p of st.products)d["prod:"+p.id]=p;return d}
function applyDoc(k,val){if(k==="meta"){S.name=val.name;S._ids=val.ids;S.products.sort((a,b)=>S._ids.indexOf(a.id)-S._ids.indexOf(b.id))}
 else if(k==="notes")S.notes=val;else if(k==="guide")S.guide=val;else if(k==="check")S.check=val;else if(k==="materials")S.materials=val;
 else if(k.startsWith("plant:"))S.plants[k.slice(6)]=val;
 else if(k.startsWith("prod:")){const i=S.products.findIndex(p=>p.id===val.id);if(i>=0)S.products[i]=val;else S.products.push(val);if(S._ids)S.products.sort((a,b)=>S._ids.indexOf(a.id)-S._ids.indexOf(b.id))}}
function dropDoc(k){if(k.startsWith("prod:"))S.products=S.products.filter(p=>"prod:"+p.id!==k)}
function save(){if(!API){try{localStorage.setItem("adlerLocal",JSON.stringify(S))}catch(e){}return}
 if(readonly()||!loaded)return;setStatus("unsaved changes…",true);clearTimeout(timer);timer=setTimeout(flush,1500)}
async function flush(){if(busy){timer=setTimeout(flush,800);return}busy=true;
 try{const d=docsOf(S);
  for(const [k,val] of Object.entries(d)){const js=JSON.stringify(val);if(REM[k]&&REM[k].json===js)continue;if(conflicts[k])continue;
   const r=await call("apiSaveDoc",k,js,REM[k]?REM[k].v:0);
   if(r.conflict){conflicts[k]=r.current;showConflicts()}else REM[k]={v:r.v,json:js}}
  for(const k of Object.keys(REM))if(!(k in d)&&!conflicts[k]){await call("apiDeleteDoc",k,REM[k].v);delete REM[k]}
  if(!Object.keys(conflicts).length)setStatus("saved "+new Date().toLocaleTimeString("en-GB"))}
 catch(e){setStatus("SAVE ERROR: "+e.message,true)}busy=false}
function showConflicts(){const ks=Object.keys(conflicts),el=document.getElementById("confl");if(!ks.length){el.classList.add("hid");return}
 el.classList.remove("hid");el.innerHTML=ks.map(k=>`<div class="warn"><b>Conflict on “${esc(k)}”</b>: ${esc(conflicts[k].by)} saved a newer version (${esc(conflicts[k].ts)}). <button class="btn sec" onclick="resolve('${esc(k)}','theirs')">Use their version (I lose my changes)</button> <button class="btn" onclick="resolve('${esc(k)}','mine')">Overwrite with mine</button></div>`).join("");setStatus("conflict to resolve",true)}
function resolve(k,how){const c=conflicts[k];delete conflicts[k];REM[k]={v:c.v,json:c.json};if(how==="theirs")applyDoc(k,JSON.parse(c.json));showConflicts();softRender();if(how==="mine")flush()}
function softRender(){if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){pendingRender=true;return}pendingRender=false;const y=window.scrollY;render(true);window.scrollTo(0,y)}
document.addEventListener("focusout",()=>{if(pendingRender)setTimeout(softRender,200)});
async function poll(){if(!TOKEN||!loaded||busy)return;
 try{const known={};for(const k in REM)known[k]=REM[k].v;const r=await call("apiPoll",known);let ch=false;
  for(const [k,d] of Object.entries(r.changed)){const mine=JSON.stringify(docsOf(S)[k]);const dirty=REM[k]&&mine!==REM[k].json;
   if(dirty){conflicts[k]=d;showConflicts()}else{REM[k]={v:d.v,json:d.json};applyDoc(k,JSON.parse(d.json));ch=true;setStatus("updated by "+d.by+" · "+d.ts.slice(11,16))}}
  for(const k of Object.keys(REM))if(!r.keys.includes(k)){const dirty=docsOf(S)[k]!==undefined&&JSON.stringify(docsOf(S)[k])!==REM[k].json;if(!dirty){delete REM[k];dropDoc(k);ch=true}}
  if(ch)softRender()}catch(e){}}
async function loadAll(){const r=await call("apiLoadAll");REM={};const keys=Object.keys(r.docs);
 if(!keys.length){S=build();loaded=true;setStatus(readonly()?"database empty":"database empty: import the initial data (⬆ Load data)",true);return}
 S=build();S.products=[];S.materials=[];for(const k of keys){REM[k]={v:r.docs[k].v,json:r.docs[k].json}}
 for(const k of ["notes","guide","check","materials","plant:TNG","plant:ZGZ"])if(REM[k])applyDoc(k,JSON.parse(REM[k].json));
 for(const k of keys)if(k.startsWith("prod:"))applyDoc(k,JSON.parse(REM[k].json));
 if(REM.meta)applyDoc("meta",JSON.parse(REM.meta.json));loaded=true;setStatus("data loaded "+new Date().toLocaleTimeString("en-GB"))}
async function doLogin(){const u=document.getElementById("l_u").value.trim(),p=document.getElementById("l_p").value,e=document.getElementById("l_e");e.textContent="";
 try{const r=await call("apiLogin",u,p);TOKEN=r.token;ME={nome:r.nome,ruolo:r.ruolo};try{sessionStorage.setItem("adl_t",TOKEN);sessionStorage.setItem("adl_u",JSON.stringify(ME))}catch(x){}await start()}catch(x){e.textContent=x.message}}
function logout(silent){TOKEN="";ME=null;loaded=false;clearInterval(pollT);try{sessionStorage.removeItem("adl_t");sessionStorage.removeItem("adl_u")}catch(e){}showLogin(silent?"Session expired: please sign in again.":"")}
function showLogin(msg){document.getElementById("app").classList.add("hid");const l=document.getElementById("login");l.classList.remove("hid");document.getElementById("l_e").textContent=msg||"";document.getElementById("l_p").value=""}
async function start(){document.getElementById("login").classList.add("hid");document.getElementById("app").classList.remove("hid");
 document.getElementById("who").textContent=ME?ME.nome+" · "+ME.ruolo:"local mode";document.getElementById("exitb").classList.toggle("hid",!API);
 try{await loadAll()}catch(e){setStatus("ERROR: "+e.message,true)}render();clearInterval(pollT);pollT=setInterval(poll,15000)}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.activeElement.id==="l_p")doLogin()});
if(!API){try{const x=JSON.parse(localStorage.getItem("adlerLocal")||"null");if(x&&x.plants)S=x}catch(e){}ME={nome:"Local",ruolo:"admin"};loaded=true;start().then(()=>setStatus("local mode (no server connected)",true))}
else if(TOKEN&&ME)start();else showLogin();
</script>
