<script>
/* ======================= EMPTY STATE (no company data in the code) ======================= */
const PL=["TNG","ZGZ"],PN={TNG:"Tangier",ZGZ:"Zaragoza",TNA:"Zaragoza FX350 automated"},PCLS={TNG:"t",ZGZ:"z",TNA:"a"},PVAR={TNG:"tng",ZGZ:"zgz",TNA:"tna"},PTAB={TNG:"T",ZGZ:"Z",TNA:"A"};
const FLAGS=()=>({dep:false,maint:false,energy:false,cassa:false,indirect:false,burdenManual:false});
const P0=()=>({days:248,opDays:248,shifts:3,hoursShift:8,paidHours:1744,pause:0,grossYear:0,social:0,energyPrice:0,energyUse:.75,maintPct:.577,burden:0,cassa:0,oee:.85,scrap:.03,ga:.08,profit:.08,produttivita:0,imposte:0,depExcl:false,burdenMode:"manual",maintMode:"manual"});
function build(){return{name:"ADLER product cost",plants:{TNG:{name:"Tangier",params:P0(),flags:FLAGS(),machines:[],dlBase:0,items:[]},ZGZ:{name:"Zaragoza",params:P0(),flags:FLAGS(),machines:[],dlBase:0,items:[]}},materials:[],products:[],notes:{},guide:{excel:[],points:[]},check:null,alignZ:false,alignBasis:"pool",recovery:false}}
/* fonti per parametro: [chiave, etichetta, UM, fonte Tangeri, fonte Zaragoza, nota] */
const SRC={BC:["Business case","b-bc"],AD:["Adler file","b-ad"],ES:["Estimate · to validate","b-es"],DE:["Calculated","b-de"]};
const NOTE=k=>(S.notes&&S.notes[k])||["ES","ES",""];
const PDEF=[
["Calendar and machine availability",[["days","Machine production days / year","days"],["shifts","Shifts / day","no."],["hoursShift","Hours / shift","h"],["_avail","Available machine hours / year","h","= days × shifts × hours"]]],
["Labour cost",[["grossYear","Gross annual salary, direct operator","€"],["social","Employer social charges","%"],["opDays","Operator working days / year","days"],["paidHours","Paid hours per operator / year","h"],["pause","Non-productive breaks / day","h"],["_net","Net presence hours / month","h","= (paid hours ÷ days − breaks) × days ÷ 12"],["_mod","Direct labour hourly cost (DL)","€/h","= gross × (1 + charges) ÷ (net hours × 12)"],["cassa","Labour inefficiency surcharge","%"]]],
["Energy and maintenance",[["energyPrice","Electricity cost","€/kWh"],["energyUse","Energy utilisation factor","%"],["maintPct","Maintenance – manual value (% of hourly depreciation)","%"],["_maintEff","Maintenance % IN USE","%","= manual value, or computed from the burden split"]]],
["Indirect costs and mark-up",[["burden","Burden rate – manual value (indirect ÷ DL)","%"],["_burdenEff","Burden rate IN USE","%","= manual value, or computed from the burden split (page “Burden & rates”)"],["oee","Default efficiency / OEE","%"],["scrap","Scrap on subtotal (materials + conversion)","%"],["profit","Profit","%"],["ga","G&A","%"],["produttivita","Productivity","%"],["imposte","Taxes","%"]]]];
const PCT=new Set(["social","energyUse","maintPct","burden","cassa","oee","scrap","profit","ga","produttivita","imposte"]);
const FDEF=[["dep","Depreciation ÷ UR","Adler: no"],["maint","Maintenance ÷ UR","Adler: no"],["energy","Energy ÷ UR","Adler: no"],["cassa","Apply inefficiency surcharge to DL","Adler: yes"],["indirect","Indirect (burden) ÷ UR","Adler: yes – penalises under-loaded machines; enable only with the complete product portfolio loaded"],["burdenManual","Apply burden also to manual (DL-only) operations","Adler: no (manual steps use direct labour cost only)"]];

/* ======================= MOTORE ======================= */
let S=build();
/* Third scenario (TNA): own machines, processes, operators; wages/energy, prices and volumes are LINKED to Tangier (read-only aliases, never stored) */
const TNA_LINK=["grossYear","social","opDays","paidHours","pause","cassa","energyPrice","energyUse"];
function linkProps(o,keys,src){for(const k of keys){const d=Object.getOwnPropertyDescriptor(o,k);if(d&&d.get)continue;Object.defineProperty(o,k,{configurable:true,enumerable:false,get:()=>src()[k],set:()=>{}})}}
const tnaOn=()=>!!(S.plants&&S.plants.TNA&&S.plants.TNA.active);
function fixS(){const want=tnaOn()?["TNG","ZGZ","TNA"]:["TNG","ZGZ"];if(PL.join()!==want.join()){PL.length=0;PL.push(...want)}
 if(!tnaOn())return;linkProps(S.plants.TNA.params,TNA_LINK,()=>S.plants.TNG.params);
 for(const p of S.products){if(!p.v.TNA)p.v.TNA={ops:[]};linkProps(p.v.TNA,["volume","price","logistic"],()=>p.v.TNG)}}
function activateTNA(){if(readonly()){alert("Read-only account");return}if(tnaOn())return;
 if(!confirm("Create the scenario “"+PN.TNA+"”?\n\nEvery product gets a third version with its own machines, processes and operators, starting as a copy of the Zaragoza ones. Wages, energy, prices and volumes stay those of Tangier. Tangier and Zaragoza data are not changed."))return;
 const cl=x=>JSON.parse(JSON.stringify(x)),T=S.plants.TNG,Z=S.plants.ZGZ;
 S.plants.TNA={name:PN.TNA,active:true,params:cl(T.params),flags:cl(T.flags),machines:cl(Z.machines),dlBase:T.dlBase,items:cl(T.items||[])};
 for(const p of S.products)p.v.TNA={ops:cl(p.v.ZGZ.ops)};
 CAL={};fixS();save();page="dash";render()}
let page="dash",selProd=null,tab="TNG",mpl="TNG",bpl="TNG",uid=1;
const nid=p=>p+Date.now().toString(36)+(uid++);
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const fm=(v,d=2)=>isFinite(v)?v.toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const fp=v=>isFinite(v)?(v*100).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1})+" %":"—";
const sg=v=>isFinite(v)?(v>0?"+":"")+fm(v,3):"—";
function derived(P){const avail=num(P.days)*num(P.shifts)*num(P.hoursShift);
 const net=((num(P.paidHours)/(num(P.opDays)||1))-num(P.pause))*num(P.opDays)/12;
 return{avail,net,mod:num(P.grossYear)*(1+num(P.social))/((net*12)||1)}}
function guOf(m,pl,st=S){if(m.guMode==="manual")return num(m.guManual);
 let sec=0;for(const p of st.products){const v=p.v[pl];if(!v)continue;for(const o of v.ops)if(o.machineId===m.id)sec+=num(v.volume)*num(o.cycle)/(num(o.eff)||1)/(num(o.cav)||1)}
 const avail=derived(st.plants[pl].params).avail*3600*(num(m.qty)||1);return avail?sec/avail:0}
const CLS={BURDEN:"Burden",GA:"G&A",MAINT:"Maintenance",ENERGY:"Energy (info)",DL:"Direct labour (base)",EXCL:"Excluded"};
function depAnnual(pl,st=S){const p=st.plants[pl],av=derived(p.params).avail;return p.machines.reduce((a,m)=>a+num(m.qty)*num(m.price)*(1-num(m.resid))*av/(num(m.life)||1),0)}
function burdenCalc(pl,st=S){const p=st.plants[pl],t={BURDEN:0,GA:0,MAINT:0,ENERGY:0,DL:0,EXCL:0},src=(pl!=="ZGZ"&&st.alignZ&&st.alignBasis!=="rate")?(st.plants.ZGZ.items||[]):(p.items||[]);for(const i of src)t[i.cls]=(t[i.cls]||0)+num(i.annual);
 const rev=st.products.reduce((a,x)=>a+(x.v[pl]?num(x.v[pl].price)*num(x.v[pl].volume):0),0),dep=depAnnual(pl,st),dl=num(p.dlBase);
 return{t,rev,dep,dl,burdenRate:dl>0?t.BURDEN/dl:NaN,maintRate:dep>0?t.MAINT/dep:NaN,gaPct:rev>0?t.GA/rev:NaN}}
let CAL={};
function calib(pl,st=S){if(st===S&&CAL[pl])return CAL[pl];const r=calibCompute(pl,st);if(st===S)CAL[pl]=r;return r}
function calibCompute(pl,st){const B=burdenCalc(pl,st),prev=st._cal;let sDL=0,sDep=0,sIC=0;st._cal=Object.assign({},prev||{});
 try{st._cal[pl]={burden:0,maint:0,B};
  for(const p of st.products){const v=p.v[pl];if(!v)continue;const c=pcalc(p,pl,st),vol=num(v.volume);sDL+=vol*c.opRows.reduce((a,r)=>a+(r.carry?r.nR:0),0);sDep+=vol*c.cG}
  const bu=sDL>0?B.t.BURDEN/sDL:0,mt=sDep>0?B.t.MAINT/sDep:0;st._cal[pl]={burden:bu,maint:mt,B};
  for(const p of st.products){const v=p.v[pl];if(!v)continue;sIC+=num(v.volume)*pcalc(p,pl,st).ic}
  return{ok:sDL>0&&sDep>0,burden:bu,maint:mt,gaRate:sIC>0?B.t.GA/sIC:0,sDL,sDep,sIC,B}}
 finally{st._cal=prev}}
function effP(pl,st=S){if(st._cal&&st._cal[pl])return st._cal[pl];const p=st.plants[pl],P=p.params,B=burdenCalc(pl,st),al=pl!=="ZGZ"&&st.alignZ;let burden=num(P.burden),maint=num(P.maintPct);
 if((P.burdenMode==="split"||al)&&isFinite(B.burdenRate))burden=B.burdenRate;if((P.maintMode==="split"||al)&&isFinite(B.maintRate))maint=B.maintRate;
 if(al&&st.alignBasis==="rate"){const z=effP("ZGZ",st);burden=z.burden;maint=z.maint}
 if(st.recovery){const c=calib(pl,st);if(c.ok){burden=c.burden;maint=c.maint}}
 return{burden,maint,B}}
function mrate(m,pl,st=S){const P=st.plants[pl].params,F=st.plants[pl].flags,D=derived(P),E=effP(pl,st),gu=guOf(m,pl,st),d=gu>0?gu:1,r={gu};
 const G0=num(m.price)*(1-num(m.resid))/(num(m.life)||1);
 const depOn=F.dep||!!st.recovery;r.G=depOn?G0/d:G0;r.I=E.maint*((F.maint&&!depOn)?G0/d:r.G);
 const M0=num(m.kw)*num(P.energyUse)*num(P.energyPrice);r.M=F.energy?M0/d:M0;
 r.R=num(m.workers)*D.mod*(F.cassa?1+num(P.cassa):1);r.T=r.R*E.burden/((F.indirect&&!st.recovery)?d:1);
 r.V=r.G+r.I+r.M+r.R+r.T;r.X=r.V-(P.depExcl?r.G:0);r.Y=r.X/60;return r}
function opCalc(o,pl,st=S){const P=st.plants[pl].params,F=st.plants[pl].flags,D=derived(P),E=effP(pl,st);
 const m=o.machineId==="MOD"?null:st.plants[pl].machines.find(x=>x.id===o.machineId),mr=m?mrate(m,pl,st):null;
 const hasCrew=o.crew!==undefined&&o.crew!==null&&o.crew!=="";let G=0,I=0,M=0,R=0,T=0;
 if(mr){G=P.depExcl?0:mr.G;I=mr.I;M=mr.M;if(hasCrew){R=num(o.crew)*D.mod*(F.cassa?1+num(P.cassa):1);T=R*E.burden/((F.indirect&&!st.recovery)?(mr.gu>0?mr.gu:1):1)}else{R=mr.R;T=mr.T}}
 else{R=hasCrew?num(o.crew)*D.mod*(F.cassa?1+num(P.cassa):1):D.mod;T=F.burdenManual?R*E.burden:0}

function pcalc(p,pl,st=S){const P=st.plants[pl].params,D=derived(P),v=p.v[pl],c={bomRows:[],opRows:[],mat:0,conv:0};

 for(const o of v.ops){const r=opCalc(o,pl,st);c.opRows.push(r);c.conv+=r.N;c.cG+=r.nG;c.cI+=r.nI;c.cM+=r.nM;c.cR+=r.nR;c.cT+=r.nT;c.heads+=r.heads;c.dlMin+=r.heads*r.L/60}

 const recOn=!!st.recovery&&!(st._cal&&st._cal[pl]);c.gaA=recOn?calib(pl,st).gaRate*c.ic:0;
 const mk=num(P.profit)+(st.recovery?0:num(P.ga))+num(P.produttivita)+num(P.imposte);c.mk=mk;c.calc=(c.ic+c.gaA)/(1-mk);c.markup=c.calc-c.ic;
 const sp=num(v.price);c.hasPrice=sp>0;c.margin=sp>0?sp-c.ic:NaN;c.marginPct=sp>0?c.margin/sp:NaN;
 c.afterGA=sp>0?c.margin-(st.recovery?c.gaA:sp*num(P.ga)):NaN;c.afterGApct=sp>0?c.afterGA/sp:NaN;c.beGA=st.recovery?c.ic+c.gaA:c.ic/(1-num(P.ga));c.matShare=c.calc?c.mat/c.calc:NaN;
 c.complete=v.ops.length>0&&p.bom.length>0;return c}

function absorb(pl,st=S){let dl=0,bur=0,dep=0,mnt=0,en=0;for(const p of st.products){const v=p.v[pl];if(!v)continue;const c=pcalc(p,pl,st),vol=num(v.volume);dl+=vol*c.cR;bur+=vol*c.cT;dep+=vol*c.cG;mnt+=vol*c.cI;en+=vol*c.cM}return{dl,bur,dep,mnt,en}}

 if(st.recovery)for(const pl of PL)for(const r of recoveryRows(pl,st)){if(r[1]>0&&Math.abs(r[2]/r[1]-1)>.005&&r[2]>0)add("o",pl,"Cost recovery",r[0]+": recovered "+fp(r[2]/r[1])+" instead of 100%","bur")}
 if(st.alignZ)add("y","TNG","Comparison basis","Tangier overhead is aligned to the Zaragoza P&L: results are a like-for-like scenario, not the Tangier Business Case","bur");
 for(const pl of PL){const p=st.plants[pl];
  p.machines.forEach(m=>{const w=wUR(guOf(m,pl,st));if(w)add(w.l,pl,"Machine · "+m.name,w.m,"mr");if(!(num(m.price)>0))add("y",pl,"Machine · "+m.name,"Price missing","mr");if(!(num(m.kw)>0))add("y",pl,"Machine · "+m.name,"kW missing","mr")});
  const A=absorb(pl,st),B=burdenCalc(pl,st),ck=(x,y,l)=>{const w=wRatio(x,y,l);if(w)add(w.l,pl,"Burden & rates",w.m,"bur")};
  ck(A.dl,B.dl,"Direct labour in the products vs direct labour base");ck(A.bur,B.t.BURDEN,"Burden recovered by the products vs burden pool");ck(A.dep,B.dep,"Depreciation absorbed vs annual depreciation of the machines");ck(A.mnt,B.t.MAINT,"Maintenance absorbed vs maintenance items");
  const gd=Math.abs(B.gaPct-num(p.params.ga));if(isFinite(gd)&&gd>.02)add(gd>.04?"o":"y",pl,"Burden & rates","G&A implied on revenue "+fp(B.gaPct)+" differs from the G&A % used ("+fp(num(p.params.ga))+")","bur");
  if(p.params.burdenMode!=="split"&&isFinite(B.burdenRate)&&num(p.params.burden)>0&&Math.abs(B.burdenRate/num(p.params.burden)-1)>.25)add("y",pl,"Burden & rates","Manual burden rate "+fp(num(p.params.burden))+" differs from the computed one "+fp(B.burdenRate),"bur");
  if(!(p.items&&p.items.length))add("y",pl,"Burden & rates","No burden items loaded (use “Feed from the Business Case”)","bur");
  st.products.forEach(pr=>{const v=pr.v[pl],c=pcalc(pr,pl,st),nm=pr.code+" · "+pr.desc;
   if(!v.ops.length)add("y",pl,"Product · "+nm,"No processes entered: cost = materials only","pd",pr.id);

function bcFixed(n){n=n.toLowerCase();
 if(n.includes("building rent"))return["GA","Facilities"];

 if(/insurance|insuusrance|inssurance/.test(n))return["GA","Insurance"];
 if(/security|24h/.test(n))return["BURDEN","Security"];
 if(/forklift|mini truck|intbound|inbound/.test(n))return["BURDEN","Logistics"];
 if(/company cars|printers/.test(n))return["GA","Vehicles / equipment"];
 if(/cleaning|ventillations/.test(n))return["BURDEN","Cleaning"];
 if(/taxes/.test(n))return["GA","Taxes"];
 if(/quality external lab|calibration/.test(n))return["BURDEN","Quality"];
 if(/maintenance/.test(n))return["BURDEN","Maintenance services"];
 if(/fire inspection|regulatory inspection|electrical|fire protection|médecine|servicio de prevención/.test(n))return["BURDEN","HSE / occupational health"];
 return["GA","Admin / IT / HR / consulting"]}
function bcVar(n){n=n.toLowerCase();
 if(/waste/.test(n))return["BURDEN","Waste"];
 if(/maintenance service contract/.test(n))return["BURDEN","Maintenance services"];
 if(/spare parts|production supplies/.test(n))return["MAINT","Maintenance material"];
 if(/claims/.test(n))return["GA","Customer claims"];
 if(/ppe/.test(n))return["BURDEN","Welfare"];

 return["GA","Admin / other"]}
function bcPlant(wb,pre,year,pl){
 const rows=n=>{const ws=wb.Sheets[pre+n];if(!ws||!ws["!ref"])return null;const rg=XLSX.utils.decode_range(ws["!ref"]);rg.s.c=0;rg.s.r=0;return XLSX.utils.sheet_to_json(ws,{header:1,defval:null,range:rg})};
 const fx=rows("FIXED_COSTS"),vr=rows("VAR_COSTS"),wf=rows("WORKFORCE");if(!fx||!vr||!wf)return null;
 const ys=String(year),items=[];let n=0;const add=(g,name,amt,c,note)=>{if(!(amt>0))return;n++;items.push({id:pl.toLowerCase()+"bc"+n,group:g,name,annual:Math.round(amt),cls:c,note})};
 // personnel
 const wh=wf.find(r=>r&&r[1]==="Cost Item"),wy=wh?wh.findIndex(c=>String(c)===ys):-1;if(wy<0)return null;
 const pv=k=>{const r=wf.find(r=>r&&typeof r[1]==="string"&&r[1].startsWith(k));return r&&typeof r[wy]==="number"?r[wy]:0};
 const dl=pv("Direct Personnel cost");
 add("Personnel","Direct personnel (operators)",dl,"DL","Business case WORKFORCE "+ys);
 add("Personnel","Indirect personnel (logistics, maintenance, support)",pv("Indirect Personnel cost"),"BURDEN","Business case WORKFORCE "+ys);
 const adm=pv("Admin Personnel cost"),sup=pv("Shift supervisors cost");
 add("Personnel","Admin personnel",adm,"GA","Business case WORKFORCE "+ys);add("Personnel","Shift supervisors",sup,"BURDEN","Business case WORKFORCE "+ys);
 add("Personnel","Managers",pv("Manager Personnel cost"),"GA","Business case WORKFORCE "+ys);
 // fixed costs
 const fh=fx.findIndex(r=>r&&r[1]==="Description"&&r.some(c=>String(c)===ys));if(fh<0)return null;const fy=fx[fh].findIndex(c=>String(c)===ys);
 for(let i=fh+1;i<fx.length;i++){const r=fx[i];if(!r||!r[1])continue;const d=String(r[1]).trim();if(d.toUpperCase().startsWith("TOTAL"))break;if(d.startsWith("▼"))break;
  const v=r[fy];if(typeof v!=="number")continue;const[c,g]=bcFixed(d);
  add(g,d.replace("In,suusrance","Insurance").replace("Inssurance","Insurance").replace("Intbound Outbound","Inbound / outbound logistics"),v,c,"Business case FIXED_COSTS "+ys+" ("+String(r[10]||"").trim()+", "+(r[11]||"")+")")}
 // variable costs
 const vh=vr.findIndex(r=>r&&r[1]==="Description"&&String(r[2]).startsWith("Cost / Month"));
 if(vh>=0)for(let i=vh+1;i<vr.length;i++){const r=vr[i];if(!r||!r[1])continue;const d=String(r[1]).trim();if(/^(APPLIED|Total)/i.test(d)||d.startsWith("▼"))break;
  const v=r[4];if(typeof v!=="number")continue;const[c,g]=bcVar(d);add(g,d,v,c,"Business case VAR_COSTS ("+String(r[6]||"").trim()+", "+(r[7]||"")+")")}
 // energy (information only)
 const er=vr.find(r=>r&&typeof r[1]==="string"&&r[1].startsWith("Annual Electricity Cost (€/year)")),pr=vr.find(r=>r&&typeof r[5]==="string"&&/€\/year/.test(r[5])&&/power/i.test(r[5])&&typeof r[6]==="number");
 if(er)add("Energy","Electricity consumption (BC annual)",er[2],"ENERGY","Information only: the console models energy from kW × €/kWh");
 if(pr)add("Energy","Electricity fixed power charge",pr[6],"ENERGY","Information only: not included in product cost");
 return{items,dl:Math.round(dl)}}

const API=window.ADLER_API||"";
let TOKEN="",ME=null,REM={},conflicts={},timer=null,busy=false,loaded=false,pendingRender=false,pollT=null;

const readonly=()=>ME&&ME.ruolo==="viewer";
async function call(fn,...args){let r;try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args,token:TOKEN})})}catch(e){throw new Error("Server unreachable")}

function setStatus(t,bad){const e=document.getElementById("stat");if(e){e.textContent=t;e.className="badge "+(bad?"b-es":"b-bc")}}
function docsOf(st){const d={meta:{name:st.name||"",ids:st.products.map(p=>p.id),alignZ:!!st.alignZ,alignBasis:st.alignBasis||"pool",recovery:!!st.recovery},notes:st.notes||{},guide:st.guide||{},materials:st.materials};if(st.check)d.check=st.check;for(const k of PL)d["plant:"+k]=st.plants[k];for(const p of st.products)d["prod:"+p.id]=p;return d}

 else if(k==="notes")S.notes=val;else if(k==="guide")S.guide=val;else if(k==="check")S.check=val;else if(k==="materials")S.materials=val;

async function flush(){if(busy){timer=setTimeout(flush,800);return}busy=true;
 try{const d=docsOf(S);
  for(const [k,val] of Object.entries(d)){const js=JSON.stringify(val);if(REM[k]&&REM[k].json===js)continue;if(conflicts[k])continue;
   const r=await call("apiSaveDoc",k,js,REM[k]?REM[k].v:0);
   if(r.conflict){conflicts[k]=r.current;showConflicts()}else REM[k]={v:r.v,json:js}}
  for(const k of Object.keys(REM))if(!(k in d)&&!conflicts[k]){await call("apiDeleteDoc",k,REM[k].v);delete REM[k]}
  if(!Object.keys(conflicts).length)setStatus("saved "+new Date().toLocaleTimeString("en-GB"))}
 catch(e){setStatus("SAVE ERROR: "+e.message,true)}busy=false}
function showConflicts(){const ks=Object.keys(conflicts),el=document.getElementById("confl");if(!ks.length){el.classList.add("hid");return}
 el.classList.remove("hid");el.innerHTML=ks.map(k=>`<div class="warn"><b>Conflict on “${esc(k)}”</b>: ${esc(conflicts[k].by)} saved a newer version (${esc(conflicts[k].ts)}). <button class="btn sec" onclick="resolve('${esc(k)}','theirs')">Use their version (I lose my changes)</button> <button class="btn" onclick="resolve('${esc(k)}','mine')">Overwrite with mine</button></div>`).join("");setStatus("conflict to resolve",true)}
function resolve(k,how){const c=conflicts[k];delete conflicts[k];REM[k]={v:c.v,json:c.json};if(how==="theirs")applyDoc(k,JSON.parse(c.json));showConflicts();softRender();if(how==="mine")flush()}
function softRender(){if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){pendingRender=true;return}pendingRender=false;const y=window.scrollY;render(true);window.scrollTo(0,y)}

async function poll(){if(!TOKEN||!loaded||busy)return;
 try{const known={};for(const k in REM)known[k]=REM[k].v;const r=await call("apiPoll",known);let ch=false;
  for(const [k,d] of Object.entries(r.changed)){const mine=JSON.stringify(docsOf(S)[k]);const dirty=REM[k]&&mine!==REM[k].json;
   if(dirty){conflicts[k]=d;showConflicts()}else{REM[k]={v:d.v,json:d.json};applyDoc(k,JSON.parse(d.json));ch=true;setStatus("updated by "+d.by+" · "+d.ts.slice(11,16))}}
  for(const k of Object.keys(REM))if(!r.keys.includes(k)){const dirty=docsOf(S)[k]!==undefined&&JSON.stringify(docsOf(S)[k])!==REM[k].json;if(!dirty){delete REM[k];dropDoc(k);ch=true}}
  if(ch)softRender()}catch(e){}}
async function loadAll(){const r=await call("apiLoadAll");REM={};const keys=Object.keys(r.docs);
